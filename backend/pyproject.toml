[project]
name = "auto-viz-backend"
version = "0.1.0"
description = "auto-viz backend API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "cryptography>=43",
    "httpx>=0.28",
    # LLM: Anthropic은 공식 SDK, 그 외 제공사는 REST(httpx)로 호출
    "anthropic>=2.8",
    # 사용자 DB 드라이버 (순수 Python: 휠이 없는 Python 버전에서도 설치 가능)
    "pg8000>=1.31",
    "pymysql>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["alembic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
